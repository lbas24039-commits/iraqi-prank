<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BLACK SITE // ACCESS</title>

<style>
*{box-sizing:border-box}

html,body{
 margin:0;
 width:100%;
 height:100%;
 background:#020403;
 color:#00ff66;
 font-family:monospace;
 overflow:hidden;
}

body{
 display:flex;
 align-items:center;
 justify-content:center;
}

body:before{
 content:"";
 position:fixed;
 inset:0;
 pointer-events:none;
 background:
 linear-gradient(rgba(0,255,100,.04) 1px,transparent 1px),
 linear-gradient(90deg,rgba(0,255,100,.025) 1px,transparent 1px);
 background-size:25px 25px;
 animation:grid 3s linear infinite;
}

@keyframes grid{
 to{background-position:0 25px,25px 0}
}

#app{
 width:min(900px,94vw);
 padding:25px;
 border:1px solid #00ff66;
 box-shadow:0 0 30px #00ff6640;
 background:#020805e8;
 position:relative;
}

h1{
 font-size:clamp(22px,6vw,45px);
 margin:0 0 10px;
 text-shadow:0 0 15px #00ff66;
 animation:glitch .12s infinite;
}

@keyframes glitch{
 0%{transform:translate(0)}
 50%{transform:translate(1px,-1px)}
 100%{transform:translate(-1px,1px)}
}

.line{
 margin:9px 0;
 font-size:clamp(13px,3.5vw,18px);
}

.red{color:#ff1744}

.warning{
 margin:20px 0;
 padding:15px;
 border:1px solid #ff1744;
 color:#ff1744;
 box-shadow:0 0 20px #ff174455;
 animation:danger .7s infinite alternate;
}

@keyframes danger{
 from{opacity:.5}
 to{opacity:1}
}

#terminal{
 height:230px;
 overflow:hidden;
 border-top:1px solid #00ff66;
 border-bottom:1px solid #00ff66;
 margin:20px 0;
 padding:12px;
 font-size:13px;
}

button{
 width:100%;
 padding:16px;
 background:#00ff66;
 color:#001b09;
 border:0;
 font-weight:bold;
 font-size:18px;
 font-family:monospace;
 cursor:pointer;
 box-shadow:0 0 20px #00ff6680;
}

button:active{
 transform:scale(.97);
}

#result{
 display:none;
 text-align:center;
}

.big{
 font-size:clamp(28px,8vw,60px);
 color:#ff1744;
 text-shadow:0 0 25px red;
 animation:shake .08s infinite;
}

@keyframes shake{
 0%{transform:translate(0)}
 25%{transform:translate(3px,1px)}
 50%{transform:translate(-3px,-1px)}
 75%{transform:translate(2px,-2px)}
 100%{transform:translate(-2px,2px)}
}

#count{
 font-size:60px;
 margin:15px;
}

.small{
 opacity:.7;
 font-size:12px;
}
</style>
</head>

<body>

<div id="app">

<div id="start">

<h1>BLACK SITE // ACCESS</h1>

<div class="line">> جاري الاتصال بالخادم...</div>
<div class="line">> فحص النظام........ <span class="red">مراقبة</span></div>
<div class="line">> تحميل بروتوكول الأمن...</div>

<div class="warning">
⚠ تحذير: تم اكتشاف نشاط غير اعتيادي
</div>

<div id="terminal"></div>

<button onclick="startPrank()">
⚡ ابدأ المقلب ⚡
</button>

<p class="small">
اضغط مرة واحدة لتفعيل النظام الصوتي
</p>

</div>

<div id="result">

<div class="big">تم اكتشافك 😂</div>

<div id="count">3</div>

<p class="line">
جاري إرسال فريق مكافحة الهكر...
</p>

<p class="line red">
لا تخاف 😂 هذا مقلب عراقي!
</p>

<button onclick="location.reload()">
🔄 إعادة المقلب
</button>

</div>

</div>

<script>

const terminal=document.getElementById("terminal");

const messages=[
"> INITIALIZING BLACK SYSTEM...",
"> الاتصال بالخادم السري...",
"> تحليل الجهاز...",
"> فحص مستوى الهكر...",
"> تحميل ملفات الأمن...",
"> ACCESS CHECK...",
"> WARNING: USER DETECTED",
"> تحديد موقع الضحية...",
"> ERROR 404: الهكر ضايع 😂",
"> SYSTEM OVERRIDE...",
"> FINAL WARNING..."
];

let i=0;

function writeLines(){
 if(i<messages.length){
   terminal.innerHTML += messages[i]+"<br>";
   terminal.scrollTop=terminal.scrollHeight;
   i++;
   setTimeout(writeLines,350);
 }
}

writeLines();


function beep(freq=700,duration=.12){

 const ctx=new (window.AudioContext||window.webkitAudioContext)();
 const osc=ctx.createOscillator();
 const gain=ctx.createGain();

 osc.frequency.value=freq;
 osc.type="square";

 gain.gain.setValueAtTime(.08,ctx.currentTime);
 gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+duration);

 osc.connect(gain);
 gain.connect(ctx.destination);

 osc.start();
 osc.stop(ctx.currentTime+duration);
}


function speak(text){

 if("speechSynthesis" in window){

   speechSynthesis.cancel();

   const voice=new SpeechSynthesisUtterance(text);

   voice.lang="ar-IQ";
   voice.rate=.85;
   voice.pitch=.65;
   voice.volume=1;

   speechSynthesis.speak(voice);
 }
}


function startPrank(){

 beep(500,.15);

 setTimeout(()=>beep(900,.15),180);
 setTimeout(()=>beep(1300,.2),360);

 if(navigator.vibrate){
   navigator.vibrate([100,70,100,70,200]);
 }

 document.getElementById("start").style.display="none";
 document.getElementById("result").style.display="block";

 let n=3;
 const count=document.getElementById("count");

 count.innerText=n;

 const timer=setInterval(()=>{

   n--;

   count.innerText=n;

   beep(900,.15);

   if(n<=0){

     clearInterval(timer);

     count.innerText="😂";

     for(let x=0;x<5;x++){
       setTimeout(()=>beep(300+Math.random()*1200,.15),x*130);
     }

     if(navigator.vibrate){
       navigator.vibrate([200,100,300,100,500]);
     }

     speak(
       "هلا بالهكر! شبيك صدگت؟ هذا مقلب عراقي يا بطل!"
     );
   }

 },1000);

}

</script>

</body>
</html>
