<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BLACK SITE // IRAQI SYSTEM</title>

<style>
*{box-sizing:border-box}
html,body{
margin:0;width:100%;height:100%;
background:#000;color:#00ff66;
font-family:monospace;overflow:hidden
}
body{
display:flex;justify-content:center;align-items:center
}
.scan{
position:fixed;inset:0;pointer-events:none;z-index:20;
background:repeating-linear-gradient(
0deg,transparent 0px,transparent 3px,
rgba(0,255,80,.07) 4px)
}
.flash{
position:fixed;inset:0;background:red;
opacity:0;pointer-events:none;z-index:30
}
.panel{
width:94%;max-width:720px;padding:22px;
border:1px solid #00ff66;background:#020604;
box-shadow:0 0 25px #00ff66,inset 0 0 30px rgba(0,255,100,.08)
}
.title{
color:#f22;font-size:22px;font-weight:bold;
text-align:center;text-shadow:0 0 15px red;margin-bottom:18px
}
.status{
border:1px solid #00ff66;padding:10px;
margin-bottom:15px;font-size:13px
}
#terminal{
height:350px;overflow:hidden;white-space:pre-wrap;
line-height:1.7;font-size:14px
}
button{
width:100%;margin-top:15px;padding:15px;
background:#001b0b;color:#00ff66;
border:1px solid #00ff66;font:bold 18px monospace;
box-shadow:0 0 12px #00ff66
}
.red{color:#f22;text-shadow:0 0 8px red}
.progress{
height:16px;border:1px solid #00ff66;margin-top:10px
}
.bar{
height:100%;width:0%;background:#00ff66;
box-shadow:0 0 12px #00ff66
}
.big{
text-align:center;font-size:35px;margin-top:10px;
color:#f22;text-shadow:0 0 15px red
}
.shake{animation:shake .07s infinite}
@keyframes shake{
0%{transform:translate(0)}
25%{transform:translate(5px,-4px)}
50%{transform:translate(-5px,4px)}
75%{transform:translate(4px,5px)}
100%{transform:translate(0)}
}
</style>
</head>

<body>

<div class="scan"></div>
<div class="flash" id="flash"></div>

<div class="panel">

<div class="title">
⚠ BLACK SITE // IRAQI SECURITY SYSTEM ⚠
</div>

<div class="status">
STATUS:
<span class="red">UNAUTHORIZED USER DETECTED</span>
<br>
SERVER: IRAQ-CLASSIFIED-████
</div>

<div id="terminal">
اضغط الزر حتى يبدأ الفحص...
</div>

<div class="progress">
<div class="bar" id="bar"></div>
</div>

<div class="big" id="count"></div>

<button id="btn" onclick="start()">
▶ تشغيل الفحص السري
</button>

</div>

<!-- ملف صراخ الرجل -->
<audio id="scream" preload="auto">
<source src="./scream.mp3" type="audio/mpeg">
</audio>

<script>

const terminal=document.getElementById("terminal");
const bar=document.getElementById("bar");
const count=document.getElementById("count");
const flash=document.getElementById("flash");
const scream=document.getElementById("scream");
const btn=document.getElementById("btn");

let audio;
let running=false;

function initAudio(){
if(!audio){
audio=new(window.AudioContext||window.webkitAudioContext)();
}
if(audio.state==="suspended") audio.resume();
}

function beep(freq=500,duration=.07){
initAudio();

let osc=audio.createOscillator();
let gain=audio.createGain();

osc.type="square";
osc.frequency.value=freq;

gain.gain.setValueAtTime(.04,audio.currentTime);
gain.gain.exponentialRampToValueAtTime(
.001,audio.currentTime+duration
);

osc.connect(gain);
gain.connect(audio.destination);

osc.start();
osc.stop(audio.currentTime+duration);
}

function sleep(ms){
return new Promise(r=>setTimeout(r,ms));
}

async function write(text,speed=18){

for(let i=0;i<text.length;i++){

terminal.innerHTML+=text[i];

if(text[i]!==" ")
beep(300+Math.random()*700,.018);

await sleep(speed);
}

terminal.innerHTML+="\n";
terminal.scrollTop=terminal.scrollHeight;
}

async function progress(){

for(let i=0;i<=100;i++){

bar.style.width=i+"%";

if(i%10===0){
beep(300+i*5,.05);
await sleep(100);
}

}
}

function redFlash(){

flash.style.opacity=".35";

setTimeout(()=>{
flash.style.opacity="0";
},180);

}

async function countdown(){

for(let i=5;i>=1;i--){

count.innerHTML=i;

beep(150,.25);

redFlash();

await sleep(700);
}

count.innerHTML="";
}


/* تشغيل صراخ الرجل */

async function playScream(){

try{

scream.currentTime=0;
scream.volume=1;

await scream.play();

}catch(error){

console.log("الصوت يحتاج ضغطة من المستخدم");

}

}


/* المفاجأة */

async function jumpScare(){

document.body.classList.add("shake");

count.innerHTML="⚠️";

redFlash();

playScream();

await sleep(150);

redFlash();

await sleep(150);

redFlash();

await sleep(1200);

document.body.classList.remove("shake");

count.innerHTML="";

}


/* المقلب */

async function start(){

if(running)return;

running=true;
btn.disabled=true;
btn.innerText="⏳ جاري الفحص...";

initAudio();

terminal.innerHTML="";
bar.style.width="0%";
count.innerHTML="";

await write(">> تهيئة النظام السري...");

await write(">> جاري الاتصال بالسيرفر...");

await write(">> الاتصال ناجح ✓");

await sleep(400);

await write(">> فحص المستخدم...");

await write(">> تحليل مستوى الفضول...");

await write(">> مستوى الفضول: 100%");

await sleep(400);

await write(">> جاري البحث عن المشاكل...");

await write(">> تم العثور على مشاكل هواية 😂");

await progress();

await write("");

await write(">> اكتمل الفحص بنسبة 100%");

await write(">> تم اكتشاف مستخدم عراقي مشبوه 👀");

await sleep(700);

await write("");

await write("⚠ تحذير: النظام بدأ يسأل أسئلة خطيرة!");

await countdown();

await sleep(300);


/* الصدمة */
scream.currentTime = 0;
scream.play().catch(e => console.log(e)) 
await jumpScare();


/* النهاية */

await write("");

await write("😂😂😂 لحظة لحظة...");

await sleep(400);

await write("يمعود شنو مسوي حتى دخلت لهنا؟ 😂");

await write("لا تدك الشاشة، ما راح تطلع فلوس 😂");

await write("اطمّن حبيبي...");

await write("هذا مجرد مقلب عراقي 🇮🇶");

await write("");

await write("الحكم النهائي:");

await write("عليك چاي لكل الجماعة ☕😂");

count.innerHTML="😂 مـقـلـب 😂";

btn.disabled=false;
btn.innerText="🔄 إعادة المقلب";

running=false;

}

</script>

</body>
</html>
